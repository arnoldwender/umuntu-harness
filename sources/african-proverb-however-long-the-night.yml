# UNVERIFIED. The thinnest evidentiary floor of all thirteen proverbs in this repo.
#
# Flagged hardest of the thirteen. Not proven false - proven unsupported. See provenance_note.
#
# `author`, `author_born`, `author_died` and `year` carry prose because this is
# anonymous oral folklore: there is no person and no date to record, and
# inventing either to satisfy an arithmetic check would make the citation look
# stronger than it is.
work: "Proverb of unspecified African origin - attribution unconfirmed"
author: "Anonymous - oral tradition"
author_born: "not applicable - anonymous oral tradition"
author_died: "not applicable - anonymous oral tradition"
year: "unknown - anonymous oral tradition, no first attestation established"
pd_status_us: "Anonymous traditional proverb - no copyright subsists. What is unverified is the ATTRIBUTION, not the copyright status."
pd_status_eu: "Anonymous traditional proverb - no copyright subsists. What is unverified is the ATTRIBUTION, not the copyright status."
source_url: "https://afriprov.tangaza.ac.ke/inventory-of-131-collections-of-african-proverbs-and-sayings/"
provenance: unverified
provenance_note: "Zero ethnic attribution anywhere in the corpus searched, which is unusual - even floating proverbs normally attract a country guess. No hit in the African Proverbs project s 131 collections, no scholarly or dictionary hit, and circulation is purely motivational. It matches the structural risk profile that NPR documented in 2016 for untraceable African proverb tags, the class that includes it takes a village to raise a child and if you want to go fast go alone. NO direct evidence was found that this specific line is of modern Western coinage, and it is NOT being called apocryphal on a hunch - inventing a debunking is the same sin as inventing a source. But of the thirteen it is the one with the least evidence of any African origin at all, and it is used in CODEX.md as the epigraph of the HARAMBEE discipline."
quotes:
  - "However long the night, the dawn will break"
