provenance_note: "Circulated as Congolese across social media, print shops and quote sites, none citing a source. The one specific-collection lead found places it instead among the DURUMA (Mijikenda) of KENYA, with a Duruma original - Bangili mwenga kayilavya mriro - and a Swahili gloss, Bangili moja haitoi sauti. That lead could not be read directly: the collection is a scanned PDF with no text layer, so it rests on search-engine indexing rather than a page anyone opened. So the position is not that the Congo attribution is unsupported but that the only concrete evidence located points to a different country and a different people."
