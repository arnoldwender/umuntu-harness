provenance_note: "Not found under any Nigerian ethnic group in the African Proverbs project. A themed variant is attributed there to the MAKONDE in Kenya - when the roots begin to rot, the branches begin to die. The label Nigerian proverb with no ethnic group named - not Yoruba, Igbo or Hausa - is itself the common shape of a floating attribution. A search for a link to Chinua Achebe, the obvious candidate if the line were literary rather than folk, found nothing."
