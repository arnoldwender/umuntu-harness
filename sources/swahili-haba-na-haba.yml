# The only proverb here that reaches a published scholarly collection.
#
# Verified 2026-09-10. "Haba na haba hujaza kibaba" is genuine Swahili -
# literally "little by little fills the kibaba", a kibaba being a traditional
# small dry measure, so the English "fills the measure" is a faithful rendering
# rather than a loose one. The proverb is present in the Swahili Proverbs
# (Methali za Kiswahili) collection hosted by the Center for African Studies at
# the University of Illinois, which is built on a real published book: Albert
# Scheven, Swahili Proverbs: Nia Zikiwa Moja, Kilicho Mbali Huja (University
# Press of America, 1981, ISBN 081911846X), a collection that grew to some 4,860
# entries.
#
# WHAT WAS NOT ESTABLISHED, stated so the citation is not read as stronger than
# it is: the page consulted did not display a per-entry Scheven catalogue
# number, so the proverb is confirmed present in the collection but not pinned
# to a page in the printed book. A search for a citation of this specific
# proverb in Jan Knappert's published Swahili work also came back empty -
# Knappert is a real Swahili scholar, but nothing here rests on him.
