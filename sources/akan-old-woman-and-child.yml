# One of only three proverbs in this repo that trace to something better than a
# listicle, and the trail is dated.
#
# Verified 2026-09-10 by fetching the page itself: this is the November 2003
# "Proverb of the Month" of the African Proverbs, Sayings and Stories project
# (Joseph Healey), which is a curated scholarly collection and not a quote mill.
# The wording matches word for word, the attribution on the page is "Akan,
# Ghana, Ivory Coast" - exactly what this repo prints - and the entry carries
# commentary crediting the African theologian John S. Pobee.
#
# A dated entry with a named commentator is what provenance looks like for oral
# folklore. It is the standard the other ten proverbs in this repo are measured
# against, and most of them do not meet it.
