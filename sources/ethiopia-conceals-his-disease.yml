provenance_note: "Not found in the Ethiopia-adjacent collections searched in the African Proverbs project; the Bukusu and Nyala collections carry DIFFERENT disease-concealment proverbs, both Kenyan. There is, however, one dated non-listicle appearance: the Smithsonian Anacostia Community Museum archive records a 1992 American Red Cross HIV/AIDS education poster by the artist Damballah Dolphus Smith using this exact proverb labelled as Ethiopian. That is genuine dated circulation of the label as of 1992; it is NOT an ethnographic source establishing oral-tradition origin. It also could not be read directly - the Smithsonian pages returned HTTP 403 - so it rests on the indexed record."
quotes:
  - "He who conceals his disease cannot expect to be cured"
