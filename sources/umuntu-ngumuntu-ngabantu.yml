# The maxim the repo is named for, and the best-attested line in it.
#
# Verified 2026-09-10. "Umuntu ngumuntu ngabantu" is a genuine Nguni Bantu
# proverb - isiZulu and isiXhosa, with the isiNdebele and Shona cognates
# (munhu munhu muvanhu) carrying the same sense. It is the sentence Southern
# African scholarship uses to define Ubuntu itself, and it is discussed as such
# by John S. Mbiti and by Desmond Tutu among others; Alexis Kagame put the
# Bantu formulation into philosophical circulation in 1956.
#
# WHAT CANNOT BE GIVEN, because it does not exist: an author, a date, or a first
# attestation. This is a living-language proverb, not a text. `author`,
# `author_born`, `author_died` and `year` therefore carry prose rather than
# numbers, and the arithmetic in CHECK 3 is inert here by design. Manufacturing
# a compiler and a publication year so the numbers had something to chew on
# would make this citation look STRONGER than it is, which is the worse of the
# two failure modes.
#
# The English beside it - "a person is a person through other persons" - is the
# standard literal rendering used across the scholarship, not a quotation from
# a named translation, and the repo does not claim otherwise.
work: "isiZulu / isiXhosa proverb (Nguni Bantu), the sentence that states Ubuntu"
author: "Anonymous - Nguni oral tradition, attributed to no person"
author_born: "not applicable - anonymous oral tradition"
author_died: "not applicable - anonymous oral tradition"
year: "unknown - a living-language proverb with no datable origin"
edition: "Cognate forms: isiNdebele and Zulu umuntu ngumuntu ngabantu; Shona munhu munhu muvanhu. Discussed as the definition of Ubuntu by Mbiti and Tutu; the Bantu formulation was put into philosophical circulation by Alexis Kagame, La Philosophie Bantu-Rwandaise de l Etre (1956)."
