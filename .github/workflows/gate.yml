# The codex in this repo says "nothing half-done: suite green, every case and
# every locale synced, the files left consistent with one another". This
# workflow is that rule turned on the repo itself: gate/nobody_left.py refuses a
# diff that touched one member of a set and left its siblings behind.
#
# Two jobs would double the Actions bill for no gain, so this one also re-runs
# the self-check: a red gate and a red self-check are the same verdict.
#
# No step interpolates untrusted input into a shell. The one expression here
# reaches `run:` through an `env:` variable, which the shell reads as data.
name: gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, for the citation gate's --online pass only. Every other step here
    # is offline and deterministic; this one asks whether the source URLs in
    # sources/ still resolve, which is a question that can only go stale.
    - cron: "0 6 * * 1"

concurrency:
  # A new push on the same branch cancels the previous run: without this, a
  # burst of commits pays for N runs and only the last one matters.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  parity:
    name: parity gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # The gate reads a diff, so it needs the history that holds the base
          # revision. The default depth of 1 leaves nothing to diff against, and
          # the gate would exit 2 rather than pretend the diff was empty.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          # 3.11 is the declared floor - `tomllib` landed there. CI runs the
          # floor so the README's claim is measured, not asserted.
          python-version: "3.11"

      - name: Install
        # pyyaml is for the citation gate. It is not required - the gate ships a
        # minimal parser for the shape sources/*.yml actually uses - but CI runs
        # the library path so the fallback is a fallback and not the only path
        # anyone ever exercises.
        run: python -m pip install --upgrade pip pytest pyyaml

      - name: Self-check (the repo keeps its own promises)
        run: python3 scripts/check.py

      - name: Parity gate
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE"
          # A push event carries the previous tip; the all-zero sha means there
          # was none (a new branch), and a pull_request carries neither.
          case "$base" in
            ""|0000000000000000000000000000000000000000) base="origin/main" ;;
          esac
          python3 gate/nobody_left.py --base "$base" --sarif parity.sarif

      - name: Citation gate (every attributed quotation traces to a source)
        # SPEAK TRUE TO THE CIRCLE, rule 4 - "invent nothing: no fabricated
        # source, number, file path, or capability." This is the source clause
        # of that rule made executable.
        run: python3 gate/citations.py --sarif citations.sarif

      - name: Citation gate, online (scheduled runs only)
        # Link rot in a source URL is not a reason to block a commit that never
        # touched the link, but it IS something to find out about before a
        # reader does. A provenance file whose URL 404s proves nothing.
        if: github.event_name == 'schedule'
        run: python3 gate/citations.py --online

      - name: Mutation check (do the tests defend the gate?)
        run: python3 tests/mutation_check.py

      - name: Mutation check (do the tests defend the citation gate?)
        run: python3 tests/mutation_check_citations.py

      - name: Tests
        run: python3 -m pytest tests/ -q

      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-sarif
          path: parity.sarif
          if-no-files-found: ignore
